<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <!-- Solid Fill Color: Black/Dark Zinc for high contrast on light/dark badges -->
  <g fill="#18181B">
    <!-- Ground / Base Line -->
    <rect x="50" y="470" width="400" height="12" rx="4" />

    <!-- Security Guard Booth (Right Side) -->
    <!-- Booth Roof Overhang -->
    <rect x="290" y="140" width="190" height="12" rx="3" />
    <!-- Booth Main Body -->
    <rect x="340" y="152" width="115" height="318" />

    <!-- Booth Window Frame (White cutout) -->
    <rect x="365" y="215" width="65" height="65" fill="#FFFFFF" stroke="#18181B" stroke-width="8" />
    <!-- Window Glass Reflections (Diagonal Lines) -->
    <line x1="375" y1="265" x2="415" y2="225" stroke="#18181B" stroke-width="4" stroke-linecap="round" />
    <line x1="385" y1="265" x2="420" y2="230" stroke="#18181B" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 3" />

    <!-- CCTV Camera Mounted on Booth -->
    <!-- Camera Arm Bracket -->
    <path d="M 340 190 H 310 V 198 H 340 Z" />
    <!-- Camera Body (Angled down-left) -->
    <g transform="rotate(18, 290, 180)">
      <polygon points="265,165 315,160 315,185 265,180" />
      <polygon points="255,162 265,165 265,180 255,183" />
      <circle cx="260" cy="172" r="3" fill="#FFFFFF" />
      <!-- Camera Lens Hood / Back -->
      <rect x="315" y="162" width="6" height="21" rx="2" />
    </g>

    <!-- Barrier Gate Pillar / Mechanism Box -->
    <rect x="270" y="260" width="45" height="210" rx="4" />

    <!-- Barrier Gate Arm (Horizontal Pole across lane) -->
    <rect x="0" y="280" width="270" height="12" rx="3" />

    <!-- Car (Left Side) -->
    <!-- Car Body Base & Roof Contour -->
    <path d="
      M 70 300 
      C 90 230 110 210 200 210 
      C 230 210 240 230 260 300 
      L 270 340 
      L 270 410 
      C 270 420 260 428 250 428 
      L 245 428 
      C 245 440 235 448 220 448 
      L 200 448 
      C 185 448 175 440 175 428 
      L 145 428 
      C 145 440 135 448 120 448 
      L 100 448 
      C 85 448 75 440 75 428 
      L 65 428 
      C 55 428 45 420 45 410 
      L 45 340 Z" />

    <!-- Car Windshield Cutout (White) -->
    <path d="
      M 95 300 
      C 105 245 120 226 190 226 
      C 215 226 225 245 235 300 Z" fill="#FFFFFF" />

    <!-- Driver Silhouette Head inside Windshield -->
    <circle cx="178" cy="265" r="22" fill="#18181B" />

    <!-- Car Headlights (White cutouts) -->
    <ellipse cx="75" cy="355" rx="10" ry="6" fill="#FFFFFF" />
    <ellipse cx="235" cy="355" rx="10" ry="6" fill="#FFFFFF" />
  </g>
</svg>
